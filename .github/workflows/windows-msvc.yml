name: Windows MSVC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: MSVC x64 ${{ matrix.configuration }} (Qt desktop)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for SQLite schema tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Fetch vcpkg manifest baseline
        shell: pwsh
        run: |
          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'
          if ([string]::IsNullOrWhiteSpace($baseline)) {
            throw "vcpkg.json does not define builtin-baseline"
          }
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --no-tags origin $baseline
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch vcpkg baseline commit $baseline"
          }
          git -C "$env:VCPKG_INSTALLATION_ROOT" cat-file -e "$baseline^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg baseline commit $baseline is not available locally"
          }

      - name: Install native dependencies
        shell: pwsh
        run: vcpkg install --triplet x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DP135_BUILD_TESTS=ON `
            -DP135_BUILD_DESKTOP=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure

      - name: Verify SQLite persistence schema
        run: python tests/infrastructure/sqlite_schema_tests.py

      - name: Verify desktop executable and Qt deployment
        shell: pwsh
        run: |
          $exe = "build/bin/Project135.exe"
          if (-not (Test-Path $exe)) {
            throw "Project135.exe was not produced at $exe"
          }

          # Qt debug builds use the 'd' suffix; Release builds do not.
          if ("${{ matrix.configuration }}" -eq "Debug") {
            $widgetsDll = "build/bin/Qt6Widgetsd.dll"
            $platformPlugin = "build/bin/platforms/qwindowsd.dll"
          } else {
            $widgetsDll = "build/bin/Qt6Widgets.dll"
            $platformPlugin = "build/bin/platforms/qwindows.dll"
          }

          if (-not (Test-Path $widgetsDll)) {
            throw "Qt Widgets runtime was not deployed: $widgetsDll"
          }
          if (-not (Test-Path $platformPlugin)) {
            throw "Qt Windows platform plugin was not deployed: $platformPlugin"
          }

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: Project135-${{ matrix.configuration }}
          path: build/bin/
          if-no-files-found: error
